# To be used with GreenIT Analysis CLI
- name: Rechercher des musiques
  url: http://localhost/
  waitForSelector: header input
  actions:
    - name: Saisir une recherche
      type: text
      element: header input
      content: "eli"

    - name: Lancer la recherche
      type: click
      element: header button
      pageChange: true
      waitForSelector: .list-music

    - name: Choisir une musique dans les résultats
      type: click
      element: .list-music > a:nth-child(1)
      pageChange: true
      waitForSelector: .music-detail > button

    - name: Lancer la musique
      type: click
      element: .music-detail > button

    - name: Retourner à l'accueil
      type: click
      element: header > nav > a
      pageChange: true
      waitForSelector: header input

    - name: Nouvelle recherche
      type: text
      element: header input
      content: "tem"

    - name: Lancer la recherche
      type: click
      element: header button
      pageChange: true
      waitForSelector: .list-music

    - name: Choisir une nouvelle musique
      type: click
      element: .list-music > a:nth-child(2)
      pageChange: true
      waitForSelector: .music-detail > button

    - name: Lancer la nouvelle musique
      type: click
      element: .music-detail > button
