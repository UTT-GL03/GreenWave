# To be used with GreenIT Analysis CLI
- name: Rechercher et écouter des musiques
  url: http://localhost/
  waitForSelector: header input[type="text"]
  actions:
    # 1. Chargement de la page d'accueil : déjà fait avec url + waitForSelector

    # 2. Effectuer une recherche
    - name: Saisir une recherche
      type: type
      element: header input[type="text"]
      value: "eli"

    - name: Lancer la recherche
      type: click
      element: header button
      pageChange: true
      waitForSelector: .list-music

    # 3. Choisir une musique
    - name: Choisir une musique dans les résultats
      type: click
      element: .list-music > a:nth-child(1)
      pageChange: true
      waitForSelector: .music-detail > button

    # 4. Lancer la musique
    - name: Lancer la musique
      type: click
      element: .music-detail > button

    # 5. Revenir à la page d'accueil
    - name: Retourner à l'accueil
      type: click
      element: header > nav > a
      pageChange: true
      waitForSelector: header input[type="text"]

    # 6. Effectuer une nouvelle recherche
    - name: Nouvelle recherche
      type: type
      element: header input[type="text"]
      value: "tem"

    - name: Lancer la recherche
      type: click
      element: header button
      pageChange: true
      waitForSelector: .list-music

    # 7. Choisir une musique
    - name: Choisir une nouvelle musique
      type: click
      element: .list-music > a:nth-child(2)
      pageChange: true
      waitForSelector: .music-detail > button

    # 8. Lancer la musique
    - name: Lancer la nouvelle musique
      type: click
      element: .music-detail > button
